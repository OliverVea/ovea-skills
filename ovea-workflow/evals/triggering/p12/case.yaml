schema_version: "1.1"
name: p12
description: "[v2] add a step that runs the linter before deploy"
tags: [load, v2, synth]
expected_outcome: "ovea-olve-pipelines skill is invoked"
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "add a step that runs the linter before deploy"
graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ovea-olve-pipelines"'
