schema_version: "1.1"
name: n09
description: "[etl] the pipeline is dropping rows somewhere, can you take a look?"
tags: [no-load, etl, seed]
expected_outcome: "ovea-olve-pipelines skill is NOT invoked"
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "the pipeline is dropping rows somewhere, can you take a look?"
graders:
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ovea-olve-pipelines"'
    min: 0
    max: 0
    arm: both
