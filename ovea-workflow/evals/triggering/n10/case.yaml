schema_version: "1.1"
name: n10
description: "[etl] set up CI/CD for this repo with GitHub Actions"
tags: [no-load, etl, synth]
expected_outcome: "ovea-olve-pipelines skill is NOT invoked"
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "set up CI/CD for this repo with GitHub Actions"
graders:
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ovea-olve-pipelines"'
    min: 0
    max: 0
    arm: both
