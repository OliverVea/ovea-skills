schema_version: "1.1"
name: p03
description: "[v2] why is the pipeline blocked? please fix it."
tags: [load, v2, seed]
expected_outcome: "ovea-olve-pipelines skill is invoked"
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "why is the pipeline blocked? please fix it."
graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ovea-olve-pipelines"'
