schema_version: "1.1"
name: p01
description: "add a delete button next to each message"
tags: [load]
expected_outcome: "ovea-ui-mocks skill is invoked"
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "add a delete button next to each message"
graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ovea-ui-mocks"'
