schema_version: "1.1"
name: n01
description: "add an API endpoint that returns how many messages there are"
tags: [no-load]
expected_outcome: "ovea-ui-mocks skill is NOT invoked"
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "add an API endpoint that returns how many messages there are"
graders:
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ovea-ui-mocks"'
    min: 0
    max: 0
    arm: both
