schema_version: "1.1"
name: p02
description: "I want a settings page where I can pick light or dark theme"
tags: [load]
expected_outcome: "ovea-ui-mocks skill is invoked"
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "I want a settings page where I can pick light or dark theme"
graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ovea-ui-mocks"'
