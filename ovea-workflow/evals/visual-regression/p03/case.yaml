schema_version: "1.1"
name: p03
description: "I changed the menu colours, check them against the baselines before I push"
tags: [load]
expected_outcome: "ovea-visual-regression skill is invoked"
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "I changed the menu colours, check them against the baselines before I push"
graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ovea-visual-regression"'
