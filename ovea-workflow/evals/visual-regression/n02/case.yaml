schema_version: "1.1"
name: n02
description: "add a test that the header renders"
tags: [load]
expected_outcome: "ovea-visual-regression skill is not invoked"
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "add a test that the header renders"
graders:
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ovea-visual-regression"'
    min: 0
    max: 0
    arm: both
